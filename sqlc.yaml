version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/database/queries/settings.sql"
      - "internal/database/queries/mappings.sql"
      - "internal/database/queries/episodes.sql"
      - "internal/database/queries/sync_logs.sql"
      - "internal/database/queries/cache.sql"
      - "internal/database/queries/auth.sql"
      - "internal/database/queries/held_episodes.sql"
    schema: "internal/database/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/database/sqlcgen"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
