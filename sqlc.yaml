version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/database/queries/settings.sql"
      - "internal/database/queries/mappings.sql"
      - "internal/database/queries/episodes.sql"
      - "internal/database/queries/sync_logs.sql"
      - "internal/database/queries/cache.sql"
      - "internal/database/queries/auth.sql"
      - "internal/database/queries/held_episodes.sql"
    schema:
      - "internal/database/migrations/001_initial_schema.sql"
      - "internal/database/migrations/002_artwork_urls.sql"
      - "internal/database/migrations/003_auth_sessions.sql"
      - "internal/database/migrations/004_notifications_muted.sql"
      - "internal/database/migrations/005_artwork_custom_slots.sql"
      - "internal/database/migrations/006_held_episodes.sql"
      - "internal/database/migrations/007_episode_not_on_afl.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/database/sqlcgen"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
