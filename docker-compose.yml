# =============================================================================
# Mizu - Docker Compose Example
# Add this to your existing *arr stack docker-compose.yml
# =============================================================================

version: "3.8"

services:
  mizu:
    build: .
    # Or use the published image:
    # image: ghcr.io/example/mizu:latest
    container_name: mizu
    restart: unless-stopped
    ports:
      - "8978:8978"
    environment:
      - TZ=America/New_York              # Your timezone
    volumes:
      - ./config/mizu:/config
    networks:
      - arr-network
    depends_on:
      - sonarr

  # --- Your existing *arr services (example) ---
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=America/New_York
  #   volumes:
  #     - ./config/sonarr:/config
  #     - /path/to/media:/media
  #   ports:
  #     - "8989:8989"
  #   restart: unless-stopped
  #   networks:
  #     - arr-network

networks:
  arr-network:
    driver: bridge
