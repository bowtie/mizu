version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - errorlint
    - noctx
  settings:
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000"]
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, noctx]
      - source: 'defer .+\.Close\(\)'
        linters: [errcheck]
      - source: 'defer .+\.Rollback\(\)'
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
