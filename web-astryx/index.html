<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mizu — track anime filler decisions and sync monitoring to Sonarr."
    />
    <meta name="theme-color" content="#1a1b26" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f0e5" media="(prefers-color-scheme: light)" />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/figtree-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Mizu</title>
    <script>
      // Fire API requests before the main JS bundle downloads/parses.
      // The inline script executes instantly — the fetch starts in
      // parallel with the 324KB bundle download, saving 50-200ms.
      // api.ts picks up the stored Response objects via window.__mizuPrefetch.
      (function () {
        var p = (window.__mizuPrefetch = {});
        // Bootstrap is always needed — shows + settings + providers.
        p.bootstrap = fetch("/api/bootstrap", {
          headers: { Accept: "application/json" },
        });
        // If on the library page, prefetch Sonarr series (needed for
        // poster/banner URLs). Starts in parallel with the JS bundle
        // instead of waiting for ShowsPage to mount.
        var path = location.pathname;
        if (path === "/" || path === "/shows") {
          p.series = fetch("/api/sonarr/series", {
            headers: { Accept: "application/json" },
          });
        }
        // If navigating directly to a show detail page, prefetch the
        // combined show + episodes endpoint too.
        var m = path.match(/^\/shows\/(\d+)/);
        if (m) {
          p.detailId = m[1];
          // Fire show-only and episodes fetches in parallel before the
          // JS bundle downloads. The show endpoint is a simple DB query
          // (583B, ~0.5ms) and resolves much faster than the episodes
          // endpoint (which may need Sonarr + AFL enrichment). This lets
          // the page show the title and tracking rules immediately.
          // The episodes endpoint has ETag support for 304 Not Modified
          // on repeat visits.
          p.show = fetch("/api/mappings/" + m[1], {
            headers: { Accept: "application/json" },
          });
          p.episodes = fetch("/api/mappings/" + m[1] + "/episodes", {
            headers: { Accept: "application/json" },
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>Mizu requires JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker for offline caching — production only.
      // In dev, caching Vite's HTML and API responses causes stale behavior.
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
