# Air — Go live reload for development
# Docs: https://github.com/air-verse/air

root = "."
tmp_dir = ".air"

[build]
# Binary output path
bin = ".air/mizu.exe"
# Build command
cmd = "go build -o .air/mizu.exe ./cmd/server"
# Watch these directories for changes
include_dir = ["cmd", "internal"]
# Watch these files
include_ext = ["go"]
# Exclude these
exclude_dir = [".air", "web-astryx", "artwork", "vendor"]
exclude_ext = ["tmp", "swp"]
# Debounce — wait this long after last change before rebuilding
delay = 2000
# Stop previous binary before starting new one
stop_on_error = true
# Send interrupt signal before kill (allows graceful shutdown)
send_interrupt = true
# Wait this long after interrupt before force-killing
kill_delay = 500

[log]
# Show build errors in log
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Clean tmp directory on exit
clean_on_exit = true
